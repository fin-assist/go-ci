name: Shared migration lint

on:
  workflow_call:
    inputs:
      private_input_run_id:
        description: Successful trusted workflow run containing the prepared inputs
        type: string
      private_input_artifact:
        description: Prepared inputs for this exact pull request
        type: string
      revision:
        type: string
        required: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Resolve the shared workflow revision
        env:
          RESOLVED_SHA: ${{ inputs.revision || job.workflow_sha }}
        run: |
          [[ "$RESOLVED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'SHARED_REVISION=%s\nFINASSIST_CI_REVISION=%s\n' "$RESOLVED_SHA" "$RESOLVED_SHA" >> "$GITHUB_ENV"
          printf 'Go CI source: `%s`\n' "$RESOLVED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore private CI inputs
        if: github.event_name == 'pull_request'
        uses: $/.github/actions/restore-private-ci
        with:
          branch-mode: ${{ inputs.revision == '' && 'true' || 'false' }}
          revision: ${{ env.SHARED_REVISION }}
          run-id: ${{ inputs.private_input_run_id }}
          artifact-name: ${{ inputs.private_input_artifact }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Validate pin
        run: |
          python3 - <<'PY'
          import json, os, re
          pin = os.environ['SHARED_REVISION']
          assert re.fullmatch('[0-9a-f]{40}', pin), 'A full SHA is required'
          assert json.load(open('.finassist-ci.json')).get('revision', pin) == pin, 'Local and CI pins differ'
          PY
      - name: Same immutable SQL and Squawk checks as local development
        run: make lint-migrations BASE_REF="origin/$BASE_REF"
