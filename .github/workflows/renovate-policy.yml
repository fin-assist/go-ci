name: Renovate policy controller
on:
  workflow_run:
    workflows: [Shared CI self checks, Renovate policy tests]
    types: [completed]
    branches: ['renovate/**']
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: renovate-policy-controller
  cancel-in-progress: false
jobs:
  gate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.actor.id == 29139614 &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      enabled: ${{ steps.activation.outputs.enabled }}
    steps:
      - name: Check exact activation value
        id: activation
        env:
          RENOVATE_POLICY_ENABLED: ${{ vars.RENOVATE_POLICY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        # Actions string equality ignores case. Shell equality keeps TRUE/True
        # outside the privileged environment; only canonical outputs leave here.
        run: |
          # POSIX cron fires every Monday. Run reconciliation every 14 days
          # from a fixed UTC Monday, independent of ISO week/year boundaries.
          if [ "$EVENT_NAME" = schedule ]; then
            epoch_monday=345600
            days_since_monday=$(( ($(date -u +%s) - epoch_monday) / 86400 ))
            if [ "$((days_since_monday / 7 % 2))" -ne 0 ]; then
              printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$RENOVATE_POLICY_ENABLED" = true ]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
          fi

  reconcile:
    needs: gate
    # The unprivileged gate emits only literal true/false, never the raw variable.
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.enabled == 'true'
    environment: renovate-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always execute reviewed code from the default branch. Never checkout a PR
      # or download artifacts/caches produced by an untrusted CI run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Reconcile Renovate PRs
        uses: ./.github/actions/renovate-policy
        with:
          enabled: ${{ needs.gate.outputs.enabled }}
          repository-root: ${{ github.workspace }}
          token: ${{ secrets.RENOVATE_POLICY_TOKEN }}
          read-token: ${{ github.token }}
