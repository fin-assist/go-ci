name: Prepare inputs for private Go CI

on:
  workflow_call:
    inputs:
      allowed_module_repositories:
        description: Space-separated private repositories with verified reader access
        type: string
        required: true
      profile:
        description: Trusted consumer module profile
        type: string
        default: service
      pull_request_number:
        description: Open pull request to prepare on the reviewed bootstrap branch
        type: string
      qase90_bsd_revision:
        description: Pinned bank-statement-data source for bank-bff Qase 90
        type: string
      qase90_analytics_revision:
        description: Pinned analytics source for bank-bff Qase 90
        type: string
      revision:
        description: Legacy full commit SHA of the trusted prepare implementation
        required: false
        type: string
    secrets:
      GO_MODULES_TOKEN:
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  prepare:
    if: >-
      github.repository_owner == 'fin-assist' &&
      ((github.event_name == 'pull_request_target' &&
        (github.event.pull_request.base.ref == 'main' ||
         startsWith(github.event.pull_request.base.ref, 'release/')) &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_run' && inputs.revision == '' &&
        github.event.action == 'in_progress' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/fin491-ci-bootstrap'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Identify this CI attempt and its shared revision
        id: attempt
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ && "$SOURCE_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT"
          details=$(timeout 35s gh api "$endpoint")
          identity=$(jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.event == "pull_request" and .repository.full_name == $repo and
                   .head_repository.full_name == $repo and
                   (.path == ".github/workflows/ci.yml" or .path == ".github/workflows/qase90.yml")) |
            . as $run |
            [.referenced_workflows[]? | select(.path |
              test("^fin-assist/go-ci/\\.github/workflows/shared-(go|lint|api|migrations|image|private-discovery|qase90)\\.yml@"))] as $shared |
            if ($run.path == ".github/workflows/qase90.yml" and ($shared | length) == 0) or
               (($shared | length) > 0 and all($shared[]; .path | test("@[0-9a-f]{40}$"))) then
              "legacy"
            else
              [$shared[] | select(.path | endswith("@main") or endswith("@refs/heads/main")) | .sha] as $refs |
              select(($refs | length) == ($shared | length) and ($refs | unique | length) == 1) |
              [$run.head_sha, $run.head_branch, $refs[0]] | @tsv
            end
          ' <<< "$details")
          if [ "$identity" = legacy ]; then
            echo 'This pinned CI attempt uses the pull_request_target preparation.'
            exit 0
          fi
          IFS=$'\t' read -r head branch revision <<< "$identity"
          [[ "$head" =~ ^[0-9a-f]{40}$ && "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
          number=$(timeout 35s gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "head=fin-assist:$branch" -F per_page=100 |
            jq -er --arg repo "$GITHUB_REPOSITORY" --arg sha "$head" '
              [.[] | select(.head.repo.full_name == $repo and .base.repo.full_name == $repo and
                .head.sha == $sha) | .number] | select(length == 1) | .[0]
            ')
          [[ "$number" =~ ^[1-9][0-9]*$ ]] || exit 1
          printf 'number=%s\nhead=%s\nrevision=%s\n' "$number" "$head" "$revision" >> "$GITHUB_OUTPUT"
      - name: Resolve the open pull request
        id: pull
        if: github.event_name != 'workflow_run' || steps.attempt.outputs.revision != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || steps.attempt.outputs.number || inputs.pull_request_number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          ATTEMPT_HEAD: ${{ steps.attempt.outputs.head }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_REF: ${{ github.event.pull_request.base.ref }}
          TRUSTED_REVISION: ${{ inputs.revision || job.workflow_sha }}
        run: |
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ && "$TRUSTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          read -r head base target < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '
            select(.state == "open" and .head.repo.full_name == .base.repo.full_name)
            | "\(.head.sha) \(.base.sha) \(.base.ref)"')
          [[ "$head" =~ ^[0-9a-f]{40}$ && "$base" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            test "$head" = "$EVENT_HEAD"
            test "$base" = "$EVENT_BASE"
            test "$target" = "$EVENT_REF"
          elif [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            test "$head" = "$ATTEMPT_HEAD"
          else
            test "$target" = main
          fi
          printf 'head=%s\nbase=%s\ntarget=%s\n' "$head" "$base" "$target" >> "$GITHUB_OUTPUT"
      - name: Require a protected release target
        if: steps.pull.outputs.head != '' && steps.pull.outputs.target != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ steps.pull.outputs.target }}
        run: |
          [[ "$TARGET_REF" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          branch=$(jq -rn --arg ref "$TARGET_REF" '$ref | @uri')
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq .protected)" = true
      - name: Read Go manifests as data from the exact PR head
        id: manifests
        if: steps.pull.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pull.outputs.head }}
          PROFILE: ${{ inputs.profile }}
          ATTEMPT_REVISION: ${{ steps.attempt.outputs.revision }}
        run: |
          mkdir -p "$RUNNER_TEMP/private-ci-input" "$RUNNER_TEMP/private-ci-output"
          for file in go.mod .finassist-ci.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/$file?ref=$HEAD_SHA" \
              > "$RUNNER_TEMP/private-ci-input/$file"
          done
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" --jq .tree.sha)
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || exit 1
          sum=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$tree" \
            --jq 'any(.tree[]; .path == "go.sum" and .mode == "100644")')
          if [ "$sum" = true ]; then
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/go.sum?ref=$HEAD_SHA" \
              > "$RUNNER_TEMP/private-ci-input/go.sum"
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          source = Path(os.environ["RUNNER_TEMP"]) / "private-ci-input"
          manifest = json.loads((source / ".finassist-ci.json").read_bytes())
          profile = os.environ["PROFILE"]
          if profile not in {"service", "library"} or manifest["profile"] != profile:
              raise SystemExit("The consumer CI profile and pull request manifest differ.")
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request_target" and "revision" not in manifest:
              print("This branch-backed PR uses workflow_run preparation.")
              raise SystemExit(0)
          attempt = os.environ["ATTEMPT_REVISION"]
          revision = attempt or manifest.get("revision", "")
          if attempt and "revision" in manifest:
              raise SystemExit("This CI attempt requires an unpinned consumer manifest.")
          if not re.fullmatch("[0-9a-f]{40}", revision):
              raise SystemExit("A full go-ci SHA is required.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"revision={revision}", file=output)
          PY
      - name: Verify the requested go-ci commit
        if: steps.manifests.outputs.revision != ''
        env:
          GH_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
          SOURCE_SHA: ${{ steps.manifests.outputs.revision }}
          TRUSTED_REVISION: ${{ inputs.revision || job.workflow_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$SOURCE_SHA" = "$TRUSTED_REVISION" ]; then
            exit 0
          fi
          main_sha=$(gh api repos/fin-assist/go-ci/git/ref/heads/main --jq .object.sha)
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(gh api "repos/fin-assist/go-ci/compare/$SOURCE_SHA...$main_sha" --jq .merge_base_commit.sha)" = "$SOURCE_SHA"
      - name: Checkout trusted preparation scripts
        if: steps.manifests.outputs.revision != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fin-assist/go-ci
          ref: ${{ inputs.revision || job.workflow_sha }}
          token: ${{ secrets.GO_MODULES_TOKEN }}
          path: .finassist-ci/trusted-preparation
          persist-credentials: false
      - name: Checkout requested go-ci commit as data
        if: steps.manifests.outputs.revision != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fin-assist/go-ci
          ref: ${{ steps.manifests.outputs.revision }}
          token: ${{ secrets.GO_MODULES_TOKEN }}
          path: .finassist-ci/requested-source
          persist-credentials: false
      - name: Prepare the pinned Qase 90 neighbors
        id: qase90
        if: steps.manifests.outputs.revision != '' && (inputs.qase90_bsd_revision != '' || inputs.qase90_analytics_revision != '')
        uses: ./.finassist-ci/trusted-preparation/.github/actions/prepare-qase90
        with:
          bsd-revision: ${{ inputs.qase90_bsd_revision }}
          analytics-revision: ${{ inputs.qase90_analytics_revision }}
          read-token: ${{ secrets.GO_MODULES_TOKEN }}
      - name: Read immutable manifests from the published library baselines
        if: steps.manifests.outputs.revision != '' && (inputs.profile == 'library')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          input="$RUNNER_TEMP/private-ci-input"
          output="$RUNNER_TEMP/private-ci-output"
          timeout 40s gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/tags?per_page=100" > "$input/tags.json"
          python3 .finassist-ci/trusted-preparation/common/scripts/select_library_baselines.py \
            --tags "$input/tags.json" > "$output/library-baselines.txt"
          while read -r tag sha; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            mkdir "$input/$tag"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/go.mod?ref=$sha" > "$input/$tag/go.mod"
            tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq .tree.sha)
            [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || exit 1
            sum=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$tree" \
              --jq 'any(.tree[]; .path == "go.sum" and .mode == "100644")')
            if [ "$sum" = true ]; then
              gh api -H 'Accept: application/vnd.github.raw+json' \
                "repos/$GITHUB_REPOSITORY/contents/go.sum?ref=$sha" > "$input/$tag/go.sum"
            fi
          done < "$output/library-baselines.txt"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.manifests.outputs.revision != ''
        with:
          go-version: '1.27.x'
          cache: false
      - name: Package the source commit
        if: steps.manifests.outputs.revision != ''
        env:
          SOURCE_SHA: ${{ steps.manifests.outputs.revision }}
        run: |
          test "$(git -C .finassist-ci/requested-source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C .finassist-ci/requested-source bundle create "$RUNNER_TEMP/private-ci-output/source.bundle" HEAD
          python3 .finassist-ci/trusted-preparation/common/scripts/private_ci_manifest.py write \
            --directory "$RUNNER_TEMP/private-ci-input" --revision "$SOURCE_SHA" \
            --manifest "$RUNNER_TEMP/private-ci-output/manifest.json"
      - name: Prefetch checksum-locked private modules
        if: steps.manifests.outputs.revision != ''
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
          ALLOWED_REPOSITORIES: ${{ inputs.allowed_module_repositories }}
          PROFILE: ${{ inputs.profile }}
          QASE90_READY: ${{ steps.qase90.outcome == 'success' }}
        run: |
          input="$RUNNER_TEMP/private-ci-input"
          output="$RUNNER_TEMP/private-ci-output"
          options=()
          if [ "$PROFILE" = library ]; then
            options+=(--include-metadata)
            while read -r tag _sha; do
              options+=(--baseline "$input/$tag/go.mod" "$input/$tag/go.sum")
            done < "$output/library-baselines.txt"
          elif [ "$QASE90_READY" = true ]; then
            for fixture in bsd analytics; do
              options+=(--baseline "$input/qase90/$fixture/go.mod" "$input/qase90/$fixture/go.sum")
            done
          fi
          python3 .finassist-ci/trusted-preparation/common/scripts/prefetch_private_modules.py \
            --go-mod "$input/go.mod" --go-sum "$input/go.sum" --output "$output/proxy" \
            --allowed-repositories "$ALLOWED_REPOSITORIES" "${options[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.manifests.outputs.revision != ''
        with:
          name: >-
            ${{ steps.attempt.outputs.revision != '' &&
                format('private-ci-source-{0}-{1}', steps.pull.outputs.head, steps.attempt.outputs.revision) ||
                format('private-ci-{0}-{1}', steps.pull.outputs.head, steps.pull.outputs.base) }}
          path: ${{ runner.temp }}/private-ci-output/
          retention-days: 5
          if-no-files-found: error
          overwrite: true
