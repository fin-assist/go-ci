name: Shared Go checks

on:
  workflow_call:
    inputs:
      private_input_run_id:
        description: Successful trusted workflow run containing the prepared inputs
        type: string
      private_input_artifact:
        description: Prepared inputs for this exact pull request
        type: string
      revision:
        description: Full SHA of the shared source used by the caller
        required: true
        type: string
      profile:
        description: Go module profile (service or library)
        required: true
        type: string
      quality_runner:
        description: Explicitly use the shared test/coverage runner (FIN-457 service migration)
        required: false
        default: false
        type: boolean
    secrets:
      GO_MODULES_TOKEN:
        required: false

permissions:
  actions: read
  contents: read

env:
  GOPRIVATE: github.com/fin-assist/*
  CI: 'true'
  SHARED_REVISION: ${{ inputs.revision }}
  SHARED_QUALITY: ${{ inputs.quality_runner }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate shared profile and revision
        env:
          SHARED_REVISION: ${{ inputs.revision }}
          SHARED_PROFILE: ${{ inputs.profile }}
        run: |
          [[ "$SHARED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'revision must be a full lowercase commit SHA' >&2; exit 1; }
          case "$SHARED_PROFILE" in service|library) ;; *) echo 'Unknown Go CI profile' >&2; exit 1 ;; esac
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Match the local source and profile
        env:
          SHARED_REVISION: ${{ inputs.revision }}
          SHARED_PROFILE: ${{ inputs.profile }}
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open('.finassist-ci.json'))
          if config['revision'] != os.environ['SHARED_REVISION'] or config['profile'] != os.environ['SHARED_PROFILE']:
              raise SystemExit('Local and CI source/profile differ')
          PY
      - name: Restore private CI inputs
        if: github.event_name == 'pull_request'
        uses: fin-assist/go-ci/.github/actions/restore-private-ci@06b73a527f535d4d3296fa6bea74b7ee177c42d3
        with:
          revision: ${{ inputs.revision }}
          run-id: ${{ inputs.private_input_run_id }}
          artifact-name: ${{ inputs.private_input_artifact }}
      - name: Checkout private CI source on trusted pushes
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fin-assist/go-ci
          ref: ${{ inputs.revision }}
          token: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}
          path: .finassist-ci/${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # bank-bff script tests execute its JavaScript helpers as well.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Access to private modules
        env:
          TOKEN: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/fin-assist/".insteadOf "https://github.com/fin-assist/"
          fi
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: All tests belong to a suite
        run: |
          if [ "$SHARED_QUALITY" = true ]; then
            python3 .finassist-ci/"$SHARED_REVISION"/common/scripts/quality.py --root "$GITHUB_WORKSPACE" test-names
          else
            make test-names
          fi
      - name: Script dependencies
        run: python3 -c 'import yaml' || { echo 'PyYAML is required for the script tests (python3-yaml).' >&2; exit 1; }
      - name: Test the scripts
        # setup-go v7 fixes the project compiler with GOTOOLCHAIN=local. Script
        # fixtures also invoke the independent pinned coverage analyzer (Go >=1.27).
        env:
          GOTOOLCHAIN: auto
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: CHANGELOG.md format
        run: |
          if [ "$SHARED_QUALITY" = true ]; then
            python3 .finassist-ci/"$SHARED_REVISION"/common/scripts/changelog.py --root "$GITHUB_WORKSPACE" check
          else
            python3 scripts/changelog.py check
          fi
      - name: Collect unit statements coverage
        id: collect_unit
        continue-on-error: true
        run: |
          if [ "$SHARED_QUALITY" = true ]; then
            python3 .finassist-ci/"$SHARED_REVISION"/common/scripts/quality.py --root "$GITHUB_WORKSPACE" collect unit
          else
            make collect-unit
          fi
      - name: Require 80 percent unit statements coverage
        id: check_unit
        if: always() && steps.collect_unit.outcome == 'success'
        continue-on-error: true
        env:
          GOTOOLCHAIN: auto
        run: |
          if [ "$SHARED_QUALITY" = true ]; then
            python3 .finassist-ci/"$SHARED_REVISION"/common/scripts/quality.py --root "$GITHUB_WORKSPACE" check unit
          else
            make check-unit
          fi
      - name: Collect integration statements coverage
        id: collect_integration
        continue-on-error: true
        run: |
          if [ "$SHARED_QUALITY" = true ]; then
            python3 .finassist-ci/"$SHARED_REVISION"/common/scripts/quality.py --root "$GITHUB_WORKSPACE" collect integration
          else
            make collect-integration
          fi
      - name: Require 80 percent integration statements coverage
        id: check_integration
        if: always() && steps.collect_integration.outcome == 'success'
        continue-on-error: true
        env:
          GOTOOLCHAIN: auto
        run: |
          if [ "$SHARED_QUALITY" = true ]; then
            python3 .finassist-ci/"$SHARED_REVISION"/common/scripts/quality.py --root "$GITHUB_WORKSPACE" check integration
          else
            make check-integration
          fi
      - name: Collect api statements coverage
        id: collect_api
        continue-on-error: true
        run: |
          if [ "$SHARED_QUALITY" = true ]; then
            python3 .finassist-ci/"$SHARED_REVISION"/common/scripts/quality.py --root "$GITHUB_WORKSPACE" collect api
          else
            make collect-api
          fi
      - name: Require 80 percent api statements coverage
        id: check_api
        if: always() && steps.collect_api.outcome == 'success'
        continue-on-error: true
        env:
          GOTOOLCHAIN: auto
        run: |
          if [ "$SHARED_QUALITY" = true ]; then
            python3 .finassist-ci/"$SHARED_REVISION"/common/scripts/quality.py --root "$GITHUB_WORKSPACE" check api
          else
            make check-api
          fi
      - name: Combined statements coverage (informational union)
        if: always() && steps.collect_unit.outcome == 'success' && steps.collect_integration.outcome == 'success' && steps.collect_api.outcome == 'success'
        env:
          GOTOOLCHAIN: auto
        run: |
          if [ "$SHARED_QUALITY" = true ]; then
            python3 .finassist-ci/"$SHARED_REVISION"/common/scripts/quality.py --root "$GITHUB_WORKSPACE" combined
          else
            make cover-combined
          fi
      - name: Coverage summary
        if: always()
        run: |
          for level in unit integration api combined; do
            echo "## $level coverage (Go statements)" >> "$GITHUB_STEP_SUMMARY"
            if [ -s "$level.report.txt" ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat "$level.report.txt" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Coverage unavailable: suite collection or input validation failed.' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo 'Each suite requires total80 independently, with go-test-coverage v2.20.1 rounding. Only the original empty go-library-template reports N/A after successful suites. Combined is informational.' >> "$GITHUB_STEP_SUMMARY"
          echo "[Coverage artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            unit.out
            integration.out
            api.out
            *.jsonl
            *.coverage.txt
            *.report.txt
          if-no-files-found: error
      # Keep the existing required status check: low coverage cannot hide behind a green go job.
      - name: Require all three suites and thresholds
        if: always()
        env:
          COLLECT_UNIT: ${{ steps.collect_unit.outcome }}
          CHECK_UNIT: ${{ steps.check_unit.outcome }}
          COLLECT_INTEGRATION: ${{ steps.collect_integration.outcome }}
          CHECK_INTEGRATION: ${{ steps.check_integration.outcome }}
          COLLECT_API: ${{ steps.collect_api.outcome }}
          CHECK_API: ${{ steps.check_api.outcome }}
        run: |
          for outcome in "$COLLECT_UNIT" "$CHECK_UNIT" "$COLLECT_INTEGRATION" "$CHECK_INTEGRATION" "$COLLECT_API" "$CHECK_API"; do
            if [ "$outcome" != success ]; then
              echo 'Every suite must execute without skips and independently meet total80.' >&2
              exit 1
            fi
          done

