name: Shared Go API compatibility

on:
  workflow_call:
    inputs:
      private_input_run_id:
        description: Successful trusted workflow run containing the prepared inputs
        type: string
      private_input_artifact:
        description: Prepared inputs for this exact pull request
        type: string
      revision:
        description: Full SHA of the shared source used by the caller
        required: true
        type: string
    secrets:
      GO_MODULES_TOKEN:
        required: false

permissions:
  actions: read
  contents: read

env:
  GOPRIVATE: github.com/fin-assist/*
  GORELEASE: golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate shared revision
        env:
          SHARED_REVISION: ${{ inputs.revision }}
        run: |
          [[ "$SHARED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'revision must be a full lowercase commit SHA' >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # API comparison needs tags and release history.
          persist-credentials: false
      - name: Restore private CI inputs
        if: github.event_name == 'pull_request'
        uses: fin-assist/go-ci/.github/actions/restore-private-ci@540e614a1272237b05a0258cfa6be333a97fb0d5
        with:
          revision: ${{ inputs.revision }}
          run-id: ${{ inputs.private_input_run_id }}
          artifact-name: ${{ inputs.private_input_artifact }}
      - name: Checkout private CI source on trusted pushes
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fin-assist/go-ci
          ref: ${{ inputs.revision }}
          token: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}
          path: .finassist-ci/${{ inputs.revision }}
          persist-credentials: false
      - name: Set the canonical go-ci cache origin
        if: github.event_name == 'push'
        env:
          REVISION: ${{ inputs.revision }}
        run: git -C ".finassist-ci/$REVISION" remote set-url origin https://github.com/fin-assist/go-ci.git
      - name: Match the local library source
        env:
          SHARED_REVISION: ${{ inputs.revision }}
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open('.finassist-ci.json'))
          if config['revision'] != os.environ['SHARED_REVISION'] or config['profile'] != 'library':
              raise SystemExit('Local and CI library source differ')
          PY
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: API changes
        shell: bash
        env:
          GOTOOLCHAIN: auto
          GITHUB_READ_TOKEN: ${{ github.token }}
          MODULES_TOKEN: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}
          SHARED_REVISION: ${{ inputs.revision }}
        run: |
          [[ "$GITHUB_REPOSITORY" =~ ^fin-assist/[a-z0-9][a-z0-9-]*$ ]] || exit 1
          origin="https://github.com/$GITHUB_REPOSITORY"
          case "$(git remote get-url origin)" in
            "$origin"|"$origin.git") ;;
            *) echo 'Unexpected repository origin for live tag checks' >&2; exit 1 ;;
          esac

          # gorelease and the live tag check need only the current private repository.
          auth=$(printf 'x-access-token:%s' "$GITHUB_READ_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=3 GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_KEY_0="http.$origin.extraHeader"
          export GIT_CONFIG_VALUE_0="Authorization: Basic $auth"
          export GIT_CONFIG_KEY_1="http.$origin.git.extraHeader"
          export GIT_CONFIG_VALUE_1="$GIT_CONFIG_VALUE_0"
          export GIT_CONFIG_KEY_2=http.followRedirects GIT_CONFIG_VALUE_2=false
          unset auth GITHUB_READ_TOKEN

          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            prepared="$RUNNER_TEMP/finassist-private-ci"
            test -f "$prepared/library-baselines.txt" || { echo 'Library inputs were not prepared' >&2; exit 1; }
            current=$(git tag --list 'v*' | { grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; } \
              | sort -rV | awk 'NR <= 2' | while read -r tag; do
                commit=$(git rev-parse "refs/tags/$tag^{commit}") || exit 1
                printf '%s %s\n' "$tag" "$commit"
              done)
            if [ "$current" != "$(cat "$prepared/library-baselines.txt")" ]; then
              echo 'Release tags changed after preparation. Run the trusted private inputs workflow again before rerunning CI.' >&2
              exit 1
            fi
            mkdir -p "$prepared/proxy"
            endpoint=$(mktemp "$RUNNER_TEMP/go-module-proxy.XXXXXX")
            rm "$endpoint"
            python3 -I ".finassist-ci/$SHARED_REVISION/common/scripts/private_module_proxy.py" \
              --root "$prepared/proxy" --address-file "$endpoint" &
            proxy_pid=$!
            trap 'kill "$proxy_pid" 2>/dev/null || true; wait "$proxy_pid" 2>/dev/null || true; rm -f "$endpoint"' EXIT
            for _ in {1..50}; do
              [ -s "$endpoint" ] && break
              kill -0 "$proxy_pid" || exit 1
              sleep 0.1
            done
            proxy=$(cat "$endpoint")
            [[ "$proxy" =~ ^http://127\.0\.0\.1:[0-9]+$ ]] || exit 1
            export GOPROXY="$proxy,https://proxy.golang.org"
            export GONOPROXY="github.com/$GITHUB_REPOSITORY"
            export GONOSUMDB="$GOPRIVATE"
          elif [ -n "$MODULES_TOKEN" ]; then
            auth=$(printf 'x-access-token:%s' "$MODULES_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$auth"
            export GIT_CONFIG_COUNT=4
            # Place the less specific organization header after the repository headers.
            export GIT_CONFIG_KEY_3=http.https://github.com/fin-assist/.extraHeader
            export GIT_CONFIG_VALUE_3="Authorization: Basic $auth"
            unset auth
          fi
          unset MODULES_TOKEN
          rm -f gorelease.txt
          python3 scripts/api_check.py
          # Published development may have compatibility diagnostics, but the analyzer
          # must still have loaded both module graphs and produced its summary.
          if [ ! -f gorelease.txt ] || ! grep -qx '# summary' gorelease.txt || grep -q '^## errors in ' gorelease.txt; then
            echo 'gorelease did not produce a complete compatibility report' >&2
            exit 1
          fi
