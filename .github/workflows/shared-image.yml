name: Shared service image

on:
  workflow_call:
    inputs:
      private_input_run_id:
        description: Successful trusted workflow run containing the prepared inputs
        type: string
      private_input_artifact:
        description: Prepared inputs for this exact pull request
        type: string
      service:
        required: true
        type: string
      revision:
        description: Full commit SHA of the shared CI source
        required: true
        type: string
      fake_llm:
        required: false
        default: false
        type: boolean
      prepare_production:
        description: Export and scan the tested primary image on main pushes
        default: false
        type: boolean
    secrets:
      GO_MODULES_TOKEN:
        required: false
    outputs:
      production_artifact_id:
        description: Same-run artifact containing the scanned image and its evidence
        value: ${{ jobs.image.outputs.production_artifact_id }}

permissions:
  actions: read
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      production_artifact_id: ${{ steps.production.outputs.artifact-id }}
    env:
      SERVICE: ${{ inputs.service }}
      CI_REVISION: ${{ inputs.revision }}
      FAKE_LLM: ${{ inputs.fake_llm }}
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Validate immutable source and image profile
        run: |
          python3 - <<'PY'
          import os
          import re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['CI_REVISION']):
              raise SystemExit('Shared CI revision must be a full commit SHA')
          services = {'service', 'user', 'analytics', 'assistant', 'bank-statement-data', 'bank-bff'}
          if os.environ['SERVICE'] not in services:
              raise SystemExit('Unsupported service image profile')
          if os.environ['FAKE_LLM'] == 'true' and os.environ['SERVICE'] != 'assistant':
              raise SystemExit('fake-llm is supported only for assistant')
          PY
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Local and CI pins agree
        run: |
          python3 - <<'PY'
          import json
          import os
          with open('.finassist-ci.json', encoding='utf-8') as stream:
              manifest = json.load(stream)
          if manifest['revision'] != os.environ['CI_REVISION']:
              raise SystemExit('Local and CI pins differ')
          PY
      - name: Restore private CI inputs
        if: github.event_name == 'pull_request'
        uses: fin-assist/go-ci/.github/actions/restore-private-ci@540e614a1272237b05a0258cfa6be333a97fb0d5
        with:
          revision: ${{ inputs.revision }}
          run-id: ${{ inputs.private_input_run_id }}
          artifact-name: ${{ inputs.private_input_artifact }}
      - name: Checkout private CI source on trusted pushes
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fin-assist/go-ci
          ref: ${{ inputs.revision }}
          token: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}
          path: .finassist-ci/${{ inputs.revision }}
          persist-credentials: false
      - name: Set the canonical go-ci cache origin
        if: github.event_name == 'push'
        env:
          REVISION: ${{ inputs.revision }}
        run: git -C ".finassist-ci/$REVISION" remote set-url origin https://github.com/fin-assist/go-ci.git
      - name: Build and smoke-test the images
        id: image
        env:
          GO_MODULES_TOKEN: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}
        run: python3 .finassist-ci/"$CI_REVISION"/common/scripts/image_smoke.py --service "$SERVICE" --fake-llm "$FAKE_LLM"
      - name: Extract stage binary from the tested image
        env:
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: python3 .finassist-ci/"$CI_REVISION"/common/scripts/stage_artifact.py --root "$GITHUB_WORKSPACE" "$SERVICE" "$IMAGE_ID" stage-artifact
      - uses: actions/upload-artifact@v7
        with:
          name: stage-${{ inputs.service }}-${{ github.sha }}-linux-amd64
          path: stage-artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Extract stage fake provider from its tested image
        if: inputs.fake_llm
        env:
          IMAGE_ID: ${{ steps.image.outputs.fake_image_id }}
        run: python3 .finassist-ci/"$CI_REVISION"/common/scripts/stage_artifact.py --root "$GITHUB_WORKSPACE" fake-llm "$IMAGE_ID" fake-llm-artifact
      - uses: actions/upload-artifact@v7
        if: inputs.fake_llm
        with:
          name: stage-fake-llm-${{ github.sha }}-linux-amd64
          path: fake-llm-artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Scan and export the tested production image
        if: inputs.prepare_production && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "fin-assist/$SERVICE"
          case "$SERVICE" in
            analytics|assistant|bank-bff|bank-statement-data|user) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 700 "$RUNNER_TEMP/service-image"
          archive="$RUNNER_TEMP/service-image/image.tar"
          docker image save --output "$archive" "$IMAGE_ID"
          cp stage-artifact/manifest.json "$RUNNER_TEMP/service-image/build.json"

          # https://github.com/aquasecurity/trivy/releases/tag/v0.76.0
          tool=$(mktemp -d)
          curl --fail --silent --show-error --location --max-time 90 \
            'https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz' \
            -o "$tool/trivy.tar.gz"
          printf '%s  %s\n' e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7 \
            "$tool/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool/trivy.tar.gz" -C "$tool" trivy
          "$tool/trivy" image --timeout 5m --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --input "$archive" --format json --output "$RUNNER_TEMP/service-image/vulnerabilities.json"
          "$tool/trivy" image --timeout 5m --scanners vuln --skip-db-update --skip-java-db-update \
            --input "$archive" --format cyclonedx --output "$RUNNER_TEMP/service-image/sbom.cdx.json"
          (
            cd "$RUNNER_TEMP/service-image"
            sha256sum image.tar build.json vulnerabilities.json sbom.cdx.json > SHA256SUMS
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: production
        if: inputs.prepare_production && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: production-image-${{ inputs.service }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-image/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
