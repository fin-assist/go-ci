name: Shared service release

on:
  workflow_call:
    inputs:
      revision:
        description: Full commit SHA of the reviewed shared CI source
        required: false
        type: string
      tag:
        description: Existing owner-created service version tag
        required: true
        type: string
      checkout_version:
        description: Preserve the service release checkout major (v4 or v7)
        required: false
        default: v4
        type: string

permissions:
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag }}
      CHECKOUT_VERSION: ${{ inputs.checkout_version }}
    steps:
      - name: Resolve the shared workflow revision
        env:
          RESOLVED_SHA: ${{ inputs.revision || job.workflow_sha }}
        run: |
          [[ "$RESOLVED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'CI_REVISION=%s\nFINASSIST_CI_REVISION=%s\n' "$RESOLVED_SHA" "$RESOLVED_SHA" >> "$GITHUB_ENV"
          printf 'Go CI source: `%s`\n' "$RESOLVED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate release invocation and immutable source
        run: |
          python3 - <<'PY'
          import os
          import re
          tag, revision = os.environ['TAG'], os.environ['CI_REVISION']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Tag is not vX.Y.Z')
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Shared CI revision must be a full commit SHA')
          if os.environ['CHECKOUT_VERSION'] not in ('v4', 'v7'):
              raise SystemExit('Unsupported service release checkout version')
          event, ref = os.environ['GITHUB_EVENT_NAME'], os.environ['GITHUB_REF']
          if not ((event == 'push' and ref == 'refs/tags/' + tag)
                  or (event == 'workflow_dispatch' and ref == 'refs/heads/main')):
              raise SystemExit('Only the matching tag push or manual main invocation may publish')
          PY
      - name: Checkout the service release with v4
        if: inputs.checkout_version == 'v4'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the service release with v7
        if: inputs.checkout_version == 'v7'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a release of this service
        run: |
          # fetch-depth:0 checkout fetched all heads while its read credential was
          # available. Do not fetch again after persist-credentials:false cleanup.
          git show-ref --verify --quiet refs/remotes/origin/main
          # Manual GITHUB_SHA belongs to main; HEAD identifies the requested tag.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$TAG does not point to a commit on main"
            exit 1
          fi
      - name: Prepare service release notes
        uses: $/.github/actions/service-release-notes
        with:
          tag: ${{ inputs.tag }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; preserving its notes and assets"
          elif gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md; then
            echo "GitHub Release $TAG published"
          elif gh release view "$TAG" > /dev/null 2>&1; then
            # Another publisher may have created it between the first read and create.
            echo "GitHub Release $TAG now exists; preserving its notes and assets"
          else
            echo "Could not publish or confirm GitHub Release $TAG" >&2
            exit 1
          fi
