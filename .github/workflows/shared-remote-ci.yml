name: Relay private service CI

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: service
      qase90_revisions:
        type: string
        default: ''
    secrets:
      CI_BROKER_TOKEN:
        required: true
      GO_MODULES_TOKEN:
        required: true
    outputs:
      accepted:
        value: ${{ jobs.relay.outputs.accepted }}
      source_run_attempt:
        value: ${{ jobs.relay.outputs.source_run_attempt }}
      go:
        value: ${{ jobs.relay.outputs.go }}
      lint:
        value: ${{ jobs.relay.outputs.lint }}
      image:
        value: ${{ jobs.relay.outputs.image }}
      migrations:
        value: ${{ jobs.relay.outputs.migrations }}
      qase90:
        value: ${{ jobs.relay.outputs.qase90 }}
      broker_url:
        value: ${{ jobs.relay.outputs.broker_url }}

permissions: {}

jobs:
  relay:
    # A distinct prefix avoids cancelling the caller when it also uses concurrency.
    concurrency:
      group: private-ci-relay-${{ github.workflow }}-${{ inputs.mode }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    outputs:
      accepted: ${{ steps.result.outputs.accepted }}
      source_run_attempt: ${{ steps.result.outputs.source_run_attempt }}
      go: ${{ steps.result.outputs.go }}
      lint: ${{ steps.result.outputs.lint }}
      image: ${{ steps.result.outputs.image }}
      migrations: ${{ steps.result.outputs.migrations }}
      qase90: ${{ steps.result.outputs.qase90 }}
      broker_url: ${{ steps.result.outputs.broker_url }}
    steps:
      # This job executes only the resolved shared source, never service or PR code.
      - name: Checkout trusted relay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fin-assist/go-ci
          ref: ${{ job.workflow_sha }}
          token: ${{ secrets.GO_MODULES_TOKEN }}
          persist-credentials: false
      - name: Dispatch and verify private CI
        id: result
        env:
          CI_BROKER_TOKEN: ${{ secrets.CI_BROKER_TOKEN }}
          CI_BROKER_MODE: ${{ inputs.mode }}
          QASE90_REVISIONS: ${{ inputs.qase90_revisions }}
          GO_CI_SHA: ${{ job.workflow_sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          SOURCE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: python3 -I common/scripts/ci_broker_relay.py
