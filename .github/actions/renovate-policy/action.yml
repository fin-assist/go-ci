name: Reviewed Renovate controller
description: Execute immutable shared controller code against caller main JSON data.
inputs:
  enabled:
    description: Exact lowercase output from the caller unprivileged activation gate.
    required: true
  repository-root:
    description: Caller main checkout containing JSON configuration only.
    default: ${{ github.workspace }}
  token:
    description: Existing repository-scoped mutation credential.
    required: false
  read-token:
    description: Existing read-only checks credential.
    required: false
runs:
  using: composite
  steps:
    - name: Reconcile with reviewed shared code
      shell: bash
      env:
        POLICY_ACTION_PATH: ${{ github.action_path }}
        POLICY_ROOT: ${{ inputs.repository-root }}
        RENOVATE_POLICY_ENABLED: ${{ inputs.enabled }}
        RENOVATE_POLICY_TOKEN: ${{ inputs.token }}
        GITHUB_READ_TOKEN: ${{ inputs.read-token }}
      run: |
        if [ "$RENOVATE_POLICY_ENABLED" != true ]; then
          echo 'Renovate policy disabled; no inputs or API read'
          exit 0
        fi
        if [ "$GITHUB_REF" != refs/heads/main ]; then
          echo 'Renovate policy requires the caller main branch' >&2
          exit 1
        fi
        case "$GITHUB_EVENT_NAME" in
          workflow_run|schedule|workflow_dispatch) ;;
          *) echo 'Renovate policy rejects this trigger' >&2; exit 1 ;;
        esac
        timeout 540s python3 -I "$POLICY_ACTION_PATH/../../../common/renovate/renovate_policy.py" --root "$POLICY_ROOT"
