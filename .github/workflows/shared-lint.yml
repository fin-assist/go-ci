name: Shared Go lint

on:
  workflow_call:
    inputs:
      private_input_run_id:
        description: Successful trusted workflow run containing the prepared inputs
        type: string
      private_input_artifact:
        description: Prepared inputs for this exact pull request
        type: string
      revision:
        type: string
        required: false
    secrets:
      GO_MODULES_TOKEN:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPRIVATE: github.com/fin-assist/*
    steps:
      - name: Resolve the shared workflow revision
        env:
          RESOLVED_SHA: ${{ inputs.revision || job.workflow_sha }}
        run: |
          [[ "$RESOLVED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'SHARED_REVISION=%s\nFINASSIST_CI_REVISION=%s\n' "$RESOLVED_SHA" "$RESOLVED_SHA" >> "$GITHUB_ENV"
          printf 'Go CI source: `%s`\n' "$RESOLVED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore private CI inputs
        if: github.event_name == 'pull_request'
        uses: $/.github/actions/restore-private-ci
        with:
          branch-mode: ${{ inputs.revision == '' && 'true' || 'false' }}
          revision: ${{ env.SHARED_REVISION }}
          run-id: ${{ inputs.private_input_run_id }}
          artifact-name: ${{ inputs.private_input_artifact }}
      - name: Checkout private CI source on trusted pushes
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: fin-assist/go-ci
          ref: ${{ env.SHARED_REVISION }}
          token: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}
          path: .finassist-ci/${{ env.SHARED_REVISION }}
          persist-credentials: false
      - name: Set the canonical go-ci cache origin
        if: github.event_name == 'push'
        run: git -C ".finassist-ci/$SHARED_REVISION" remote set-url origin https://github.com/fin-assist/go-ci.git
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate pin
        run: |
          python3 - <<'PY'
          import json, os, re
          pin = os.environ['SHARED_REVISION']
          assert re.fullmatch('[0-9a-f]{40}', pin), 'A full SHA is required'
          assert json.load(open('.finassist-ci.json')).get('revision', pin) == pin, 'Local and CI pins differ'
          PY
      - name: Access to private modules on trusted pushes only
        env:
          TOKEN: ${{ github.event_name == 'push' && secrets.GO_MODULES_TOKEN || '' }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/fin-assist/".insteadOf "https://github.com/fin-assist/"
          fi
      - name: Same command and configuration as local development
        run: make lint
