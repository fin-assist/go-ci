name: Shared migration lint

on:
  workflow_call:
    inputs:
      private_input_run_id:
        description: Successful trusted workflow run containing the prepared inputs
        type: string
      private_input_artifact:
        description: Prepared inputs for this exact pull request
        type: string
      revision:
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}
      SHARED_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore private CI inputs
        if: github.event_name == 'pull_request'
        uses: fin-assist/go-ci/.github/actions/restore-private-ci@540e614a1272237b05a0258cfa6be333a97fb0d5
        with:
          revision: ${{ inputs.revision }}
          run-id: ${{ inputs.private_input_run_id }}
          artifact-name: ${{ inputs.private_input_artifact }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Validate pin
        run: |
          python3 - <<'PY'
          import json, os, re
          pin = os.environ['SHARED_REVISION']
          assert re.fullmatch('[0-9a-f]{40}', pin), 'A full SHA is required'
          assert json.load(open('.finassist-ci.json'))['revision'] == pin, 'Local and CI pins differ'
          PY
      - name: Same immutable SQL and Squawk checks as local development
        run: make lint-migrations BASE_REF="origin/$BASE_REF"
