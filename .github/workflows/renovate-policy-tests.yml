name: Renovate policy tests
on:
  pull_request:
  push:
    branches: [main, 'release/**']
permissions:
  contents: read
jobs:
  policy-tests:
    name: Renovate policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: ./.github/actions/renovate-policy-tests
        with:
          mode: policy
          repository-root: ${{ github.workspace }}

  runtime-contract:
    name: Renovate runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Set locked runtime location
        run: echo "RENOVATE_RUNTIME=$GITHUB_WORKSPACE/scripts/renovate-runtime" >> "$GITHUB_ENV"
      - name: Install pinned Renovate without install scripts
        working-directory: scripts/renovate-runtime
        run: timeout 600s npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify shared Renovate runtime contracts
        uses: ./.github/actions/renovate-policy-tests
        with:
          mode: runtime
          repository-root: ${{ github.workspace }}
          runtime-path: ${{ env.RENOVATE_RUNTIME }}
